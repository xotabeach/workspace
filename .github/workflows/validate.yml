name: Validate workspace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout superproject and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Lint root Markdown
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "README.md"

      - name: Validate workspace
        run: make validate
