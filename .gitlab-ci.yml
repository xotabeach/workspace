stages:
  - validate

variables:
  GIT_SUBMODULE_STRATEGY: none

workspace-validate:
  stage: validate
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - test -f README.md
    - test -f .gitmodules
    - test -f docs/README.md
    - test -f docs/development-workflow.md
    - bash -n scripts/migrate-to-gitlab.sh
    - bash -n scripts/mirror-to-github.sh
    - bash -n scripts/setup-gitlab-group.sh
    - test -f tourism-platform/compose.yaml || echo "NOTE: submodule not checked out; compose validated in tourism-platform CI"
