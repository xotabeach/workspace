stages:
  - code-style
  - run-tests
  - mirror

variables:
  GIT_SUBMODULE_STRATEGY: none

workspace-code-style:
  stage: code-style
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - bash -n scripts/migrate-to-gitlab.sh
    - bash -n scripts/mirror-to-github.sh
    - bash -n scripts/ci-mirror-to-github.sh
    - bash -n scripts/setup-gitlab-group.sh

workspace-run-tests:
  stage: run-tests
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - test -f README.md
    - test -f .gitmodules
    - test -f docs/README.md
    - test -f docs/development-workflow.md
    - >
      test -f tourism-platform/compose.yaml
      || echo "NOTE: submodule not checked out; compose validated in tourism-platform CI"

# Public GitHub showcase mirror. GitLab remains source of truth.
# Requires group/project CI variables: GITHUB_MIRROR_TOKEN, optional GITHUB_MIRROR_OWNER.
github-mirror:
  stage: mirror
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/ci-mirror-to-github.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "gamma" && $GITHUB_MIRROR_TOKEN'
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_MIRROR_TOKEN'
  needs:
    - workspace-code-style
    - workspace-run-tests
